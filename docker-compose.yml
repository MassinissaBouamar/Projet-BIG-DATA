services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    hostname: rustfs
    ports:
        - "9000:9000"  # S3 API
        - "9001:9001"  # Web console
    environment:
        - RUSTFS_ADDRESS=0.0.0.0:9000
        - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
        - RUSTFS_CONSOLE_ENABLE=true
        - RUSTFS_ACCESS_KEY=rustfsadmin
        - RUSTFS_SECRET_KEY=rustfsadmin
        - RUSTFS_VOLUMES=/data
    volumes:
        - rustfs-data:/data
    networks:
        - spark-net

  spark-master:
    image: apache/spark:4.2.0
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master"]
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:4.2.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:4.2.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - spark-net
  postgres:
    image: postgres:17
    container_name: nyc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyc}
      POSTGRES_DB: ${POSTGRES_DB:-nyc_dw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyc_dw}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./exo3_sql_olap:/sql:ro
    networks:
      - spark-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rustfs-data:
  postgres-data:

networks:
  spark-net:
    driver: bridge




